
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Publisher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-blue-400">News Automation Tracker</h1>
            <button onclick="postNow()" id="postBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium transition">
                Post News Now
            </button>
        </div>

        <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-700 text-slate-300 uppercase text-xs">
                    <tr>
                        <th class="px-6 py-3">Article Title</th>
                        <th class="px-6 py-3">Date Posted</th>
                        <th class="px-6 py-3">Link</th>
                    </tr>
                </thead>
                <tbody id="logTable" class="divide-y divide-slate-700">
                    <!-- Data loads here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadLogs() {
            const res = await fetch('/api/logs');
            const data = await res.json();
            const table = document.getElementById('logTable');
            table.innerHTML = '';
            
            data.forEach(item => {
                table.innerHTML += `
                    <tr class="hover:bg-slate-750 transition">
                        <td class="px-6 py-4 font-medium">${item.title}</td>
                        <td class="px-6 py-4 text-slate-400 text-sm">${item.posted_at}</td>
                        <td class="px-6 py-4">
                            <a href="${item.url}" target="_blank" class="text-blue-400 hover:underline text-sm">View $ightarrow$</a>
                        </td>
                    </tr>
                `;
            });
        }

        async function postNow() {
            const btn = document.getElementById('postBtn');
            btn.innerText = 'Posting...';
            btn.disabled = true;
            
            const res = await fetch('/api/post-now', { method: 'POST' });
            const data = await res.json();
            
            alert(data.message || data.status);
            btn.innerText = 'Post News Now';
            btn.disabled = false;
            loadLogs();
        }

        loadLogs();
    </script>
</body>
</html>
